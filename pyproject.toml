[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csiee"
version = "0.2.0"
description = "Chinese Student in English Exam: zero-parameter, option-only guessing baselines."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.scripts]
csiee = "csiee.cli:main"

[tool.setuptools.packages.find]
include = ["csiee*"]
